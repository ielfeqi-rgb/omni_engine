name: Omni Engine CI

on:
  push:
    branches: [ "main", "release/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "release/**" ]

env:
  CARGO_TERM_COLOR: always
  LD_LIBRARY_PATH: ${{ github.workspace }}/bin
  OMNI_ALLOW_UNSANDBOXED: "1"

jobs:
  build_and_test:
    name: Build & Verify Suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install System Dependencies
      run: |
        sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
        ( sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap ) || true

    - name: Download Pre-built Runtime Libraries
      run: |
        mkdir -p bin
        curl -fsSL https://github.com/ielfeqi-rgb/omni_engine/releases/download/v2.2.2/omni_engine_v2.2.2_linux_x86_64.tar.gz | tar -xz
        chmod +x bin/* 2>/dev/null || true

    - name: Build Debug & Release
      run: |
        cargo build --verbose
        cargo build --release --verbose

    - name: Execute Full Unit & Invariant Test Suite
      run: |
        ln -sf libllama.so bin/libllama.so.0 2>/dev/null || true
        ln -sf libggml.so bin/libggml.so.0 2>/dev/null || true
        ln -sf libggml-base.so bin/libggml-base.so.0 2>/dev/null || true
        ln -sf libggml-cpu.so bin/libggml-cpu.so.0 2>/dev/null || true
        LD_LIBRARY_PATH="${{ github.workspace }}/bin:$LD_LIBRARY_PATH" cargo test --lib --verbose
